# FR-Jus 2025-09-08 evening -- IRGASON open-path, 20 Hz, TOA5.
#
# End-to-end plausibility run. No reference output exists for this site, so nothing here is
# a validation against anything; see docs/VALIDATION.md section 2.
#
# Run from the repository root:
#     python -m miniflux run examples/fr_jus_openpath.ini
#
# Every setting is the documented default unless the comment says otherwise.

[files]
input_glob      = D:/_gitRepo/ONEFlux_preproc/data/sample/FR-Jus_20250908/FLUX/*.csv
output_csv      = ./out/fr_jus.csv
header_line     = 2              # TOA5: line 1 is the station banner, line 2 the names
first_data_line = 5              # lines 3 and 4 are the unit and the aggregation banner
delimiter       = ,
quotechar       = "
na_values       = -9999,NAN,NaN,nan,
encoding        = utf-8-sig

[runtime]
use_numpy = auto
log_level = INFO

[site]
site_id            = FR-Jus
latitude           = 48.85       # ASSUMED Paris, from the FR- prefix and the ICOS Cities
                                 # logger program name. Enters the ITC test only.
measurement_height = 30.0        # ASSUMED. The tower geometry is not distributed with the
                                 # sample. It enters ZL and ITC only, never a flux, and
                                 # MO_LENGTH does not depend on it at all.
canopy_height      = 0.0
displacement_height =            # -> 0.0 with a WARNING; an urban roughness sublayer
                                 # displacement is not knowable from the sample
north_offset       = 0.0         # UNKNOWN. WD is therefore in the sonic frame, not in
                                 # degrees from true north. Affects WD only.
pressure_pa        =             # not used: p_air below is a column

[period]
averaging_minutes     = 30
closed                = right
acquisition_frequency = 20.0
min_samples           = 0        # keep every period, including the short ones, and let
                                 # N_IN in the table say which they are

[timestamp]
column = TIMESTAMP
format = iso

[variables]
u     = RAW_IRGASON_Ux
v     = RAW_IRGASON_Uy
w     = RAW_IRGASON_Uz
ts    = RAW_IRGASON_Ts
co2   = RAW_IRGASON_CO2
h2o   = RAW_IRGASON_H2O
ta    =                          # RAW_IRGASON_CellT is the analyser block temperature, not
                                 # ambient air: it sits ~1.8 K below Ts and is updated far
                                 # more slowly. Left empty -> Ta is derived from the sonic
                                 # temperature per sample (ALGORITHMS section 8.1).
p_air = RAW_IRGASON_CellPrs      # see docs/VALIDATION.md section 2.2 for why

[units]
ts    = degC
ta    = degC
p_air = kPa
co2   = mg/m3
h2o   = g/m3

[gases]
co2_measure_type = molar_density # open path: the IRGASON reports a density, so WPL is owed
h2o_measure_type = molar_density

[despike]
enabled   = true
variables = u,v,w,ts,co2,h2o
q         = 7.0

[rotate]
method = double

[lag]
method  = covmax_default
scalars = co2,h2o
co2_nominal_s = 0.0              # collocated open path: the physical lag is ~0
co2_min_s     = -2.0
co2_max_s     = 2.0
h2o_nominal_s = 0.0
h2o_min_s     = -2.0
h2o_max_s     = 2.0

[detrend]
method    = block
variables = u,v,w,ts,co2,h2o

[wpl]
enabled = auto

[qc]
steady_state_pair = w,co2
itc               = true

[output]
na_value     = -9999
float_format = %.6g
