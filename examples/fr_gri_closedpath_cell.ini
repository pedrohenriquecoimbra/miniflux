# FR-Gri 2022-05-14 -- LI-7200 CLOSED PATH, read as the CELL MOLAR DENSITY it also reports.
#
# The same half hours as examples/fr_gri_closedpath_dry.ini, from the other pair of columns.
# CO2_CONC and H2O_CONC are molar densities in the analyser's CELL, at T_CELL and PRESS_CELL,
# not at the tower. miniflux converts them per sample to a dry mixing ratio (ALGORITHMS 2A),
# after which the run is identical to its companion: nothing is owed an ambient WPL.
#
# THE TWO TABLES MUST AGREE. They are one measurement written down twice, so the CO2 and H2O
# fluxes from this file and from fr_gri_closedpath_dry.ini are the check that the conversion
# is right. What little difference remains is the analyser's own firmware rounding between
# the two shapes, not an error in the conversion.
#
# The dry-mixing-ratio route is the one to prefer: it is exact and needs no cell state. This
# one exists for files that carry only the density.
#
# WHAT THIS RUN STILL DOES NOT DO: with [spectral] enabled = false the reported FC, LE and E
# are attenuated by the tube and are UNDERESTIMATES. The run says so once, at WARNING.
#
# Run from the repository root:
#     python -m miniflux run examples/fr_gri_closedpath_cell.ini

[files]
input_glob      = D:/_gitRepo/ONEFlux_preproc/data/sample/FR-Gri_20220514/FLUX/FR-Gri_EC_20220514*.csv
output_csv      = ./out/fr_gri_cell.csv
header_line     = 1
first_data_line = 2
delimiter       = ,
quotechar       = "
na_values       = -9999,NAN,NaN,nan,
encoding        = utf-8

[runtime]
use_numpy = auto
log_level = INFO

[site]
site_id            = FR-Gri
latitude           = 48.844243   # from the EddyPro site metadata shipped with the sample
measurement_height = 2.0         # instr_1_height in the same metadata (Gill HS-50)
canopy_height      = 0.15        # -> displacement = 0.10 m, i.e. z - d = 1.90 m
displacement_height =
north_offset       = 250.0       # instr_1_north_offset in the same metadata
pressure_pa        =             # p_air is a column below (PRESS_BOX, the LI-7200's own
                                 # near-ambient barometer). The sample carries no separate
                                 # ambient-pressure input, and miniflux invents none.

[period]
averaging_minutes     = 30
closed                = right    # each file holds (T-30min, T]; the file name is the period END
acquisition_frequency = 20.0
min_samples           = 0

[timestamp]
column = TIMESTAMP
format = numeric

[variables]
u      = U
v      = V
w      = W
ts     = T_SONIC
co2    = CO2_CONC                # mmol m-3 in the ANALYSER CELL, not at the tower
h2o    = H2O_CONC                # ditto; it also supplies the cell water fraction that the
                                 # conversion divides by
ta     =                         # no ambient thermometer in the sample; Ta comes from Ts
p_air  = PRESS_BOX               # AMBIENT, for the flux factor and the thermodynamics
t_cell = T_CELL                  # the CELL's own state, required to convert the two above
p_cell = PRESS_CELL

[units]
ts     = K
ta     = K
p_air  = kPa
t_cell = degC
p_cell = kPa
co2    = mmol/m3
h2o    = mmol/m3

[gases]
co2_measure_type = molar_density
h2o_measure_type = molar_density
analyser_path    = closed        # THE key: it says the densities above are cell densities.
                                 # Declared open, the same two columns would be taken for
                                 # ambient densities and given an ambient WPL -- a plausible
                                 # number computed for air that never existed.

[despike]
enabled   = true
variables = u,v,w,ts,co2,h2o
q         = 7.0

[rotate]
method = double

[lag]
method  = covmax_default
scalars = co2,h2o
co2_nominal_s = 0.3
co2_min_s     = -2.0
co2_max_s     = 2.0
h2o_nominal_s = 0.3
h2o_min_s     = -2.0
h2o_max_s     = 2.0

[detrend]
method    = block
variables = u,v,w,ts,co2,h2o

[wpl]
enabled = auto                   # -> does not run: cell.convert has already made both gases
                                 # dry mixing ratios, so nothing is owed (ALGORITHMS 10.1)

[spectral]
enabled   = false                # see the header: FC, LE and E are attenuated while this is off
co2_tau_s =
h2o_tau_s =

[qc]
steady_state_pair = w,co2
itc               = true

[output]
na_value     = -9999
float_format = %.6g
