# FR-Gri 2022-05-14 -- PRESSURE SENSITIVITY VARIANT of examples/fr_gri_wind_sonic.ini.
#
# The only difference from that file: ambient pressure is taken from the measured PRESS_BOX
# column (the LI-7200 box barometer, ~100.65 kPa on this day) instead of the 99767.5 Pa
# constant EddyPro fell back to from the 125 m station altitude. Nothing else is touched.
# Its purpose is to say how much of H rests on the pressure and not on the turbulence; see
# docs/VALIDATION.md section 3.6.
#
# This configuration exists to compare miniflux's WIND and SONIC-TEMPERATURE quantities
# (Tau, u*, H, wind direction, the two rotation angles, the variances) against the EddyPro
# 7.0.9 reference output shipped beside the raw data.
#
# THE GAS FLUXES OF THIS RUN ARE NOT VALID AND ARE NOT REPORTED. The LI-7200 is a
# closed-path analyser: its signal is attenuated in 71.1 m of tube, and miniflux has no
# tube-attenuation correction and refuses to pretend otherwise. CO2 and H2O are declared
# here only because
#   (a) [variables] requires all six high-frequency columns (CONTRACT section 5.2.6), and
#   (b) H needs a water vapour flux for the Schotanus correction and a humidity for rho
#       and cp, and leaving water out would be a worse error than using an attenuated one.
# FC, LE, E and the CO2/H2O lags from this run are discarded; see docs/VALIDATION.md
# section 3.2.
#
# Run from the repository root:
#     python -m miniflux run examples/fr_gri_wind_sonic.ini

[files]
input_glob      = D:/_gitRepo/ONEFlux_preproc/data/sample/FR-Gri_20220514/FLUX/FR-Gri_EC_20220514*.csv
output_csv      = ./out/fr_gri_pbox.csv
header_line     = 1
first_data_line = 2
delimiter       = ,
quotechar       = "
na_values       = -9999,NAN,NaN,nan,
encoding        = utf-8

[runtime]
use_numpy = auto
log_level = INFO

[site]
site_id            = FR-Gri
latitude           = 48.844243   # from the EddyPro site metadata shipped with the sample
measurement_height = 2.0         # instr_1_height in the same metadata (Gill HS-50)
canopy_height      = 0.15        # ditto; -> displacement = 0.10 m, which is the 1.90 m
                                 # (z-d) EddyPro's own (z-d)/L and L columns imply
displacement_height =
north_offset       = 250.0       # instr_1_north_offset in the same metadata
pressure_pa        =             # see below: p_air is a column in this variant
                                 # half hour of the sample (it has no ambient-pressure input
                                 # and falls back to the 125 m station altitude). Declared
                                 # here so the comparison measures the turbulence
                                 # processing and not a difference of pressure. The measured
                                 # PRESS_BOX alternative is run separately in
                                 # examples/fr_gri_wind_sonic_pbox.ini.

[period]
averaging_minutes     = 30
closed                = right    # each file holds (T-30min, T]; the file name and EddyPro's
                                 # date/time column are both the period END
acquisition_frequency = 20.0
min_samples           = 0

[timestamp]
column = TIMESTAMP
format = numeric

[variables]
u     = U
v     = V
w     = W
ts    = T_SONIC
co2   = CO2_DRY                  # closed path -- see the header note; not reported
h2o   = H2O_DRY                  # closed path -- see the header note; not reported
ta    =                          # no ambient temperature column exists (EddyPro's
                                 # col_air_t is 0 too); Ta is derived from the sonic
p_air = PRESS_BOX

[units]
ts    = K
ta    = K
p_air = kPa
co2   = ppm                      # CO2_DRY is a dry mole fraction, umol mol-1 of dry air
h2o   = ppt                      # H2O_DRY is a dry mole fraction, mmol mol-1 of dry air

[gases]
co2_measure_type = mixing_ratio
h2o_measure_type = mixing_ratio

[despike]
enabled   = true
variables = u,v,w,ts,co2,h2o
q         = 7.0                  # the EddyPro run used despike_vm=1, Mauder et al. (2013),
                                 # which is this method at this threshold

[rotate]
method = double                  # the EddyPro run used rot_meth=1, double rotation

[lag]
method  = covmax_default         # the EddyPro run used tlag_meth=2, maxcov&default
scalars = co2,h2o
co2_nominal_s = 0.0              # the gas lags are not validated here and shift neither w
co2_min_s     = -2.0             # nor ts, so they cannot touch Tau, u*, WD or the angles
co2_max_s     = 2.0
h2o_nominal_s = 0.0
h2o_min_s     = -2.0
h2o_max_s     = 2.0

[detrend]
method    = block                # the EddyPro run used detrend_meth=0, block average
variables = u,v,w,ts,co2,h2o

[wpl]
enabled = auto                   # both gases are dry mixing ratios, so nothing is owed

[qc]
steady_state_pair = w,ts         # the sonic-temperature flux is the one this run validates
itc               = true

[output]
na_value     = -9999
float_format = %.6g
