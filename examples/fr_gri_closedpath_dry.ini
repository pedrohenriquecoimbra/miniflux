# FR-Gri 2022-05-14 -- LI-7200 CLOSED PATH, read as the DRY MIXING RATIO it reports.
#
# This is the RECOMMENDED way to run a closed-path analyser. CO2_DRY and H2O_DRY are already
# per mole of dry air, which is a conserved quantity: no cell state is needed, no conversion
# is done, and no density (WPL) correction is owed. It is exact.
#
# Its companion examples/fr_gri_closedpath_cell.ini reads the SAME half hours from the cell
# molar densities instead (CO2_CONC / H2O_CONC with T_CELL and PRESS_CELL), which miniflux
# converts per sample. The two are the same measurement reported twice, so the two tables
# must agree; that agreement is the test that the conversion is right.
#
# WHAT THIS RUN STILL DOES NOT DO: with [spectral] enabled = false the reported FC, LE and E
# are attenuated by the tube and are UNDERESTIMATES. The run says so once, at WARNING.
# Switch [spectral] on -- with a time constant you have measured -- to publish an estimate of
# what was lost in FC_SPEC / LE_SPEC / E_SPEC beside them.
#
# Run from the repository root:
#     python -m miniflux run examples/fr_gri_closedpath_dry.ini

[files]
input_glob      = D:/_gitRepo/ONEFlux_preproc/data/sample/FR-Gri_20220514/FLUX/FR-Gri_EC_20220514*.csv
output_csv      = ./out/fr_gri_dry.csv
header_line     = 1
first_data_line = 2
delimiter       = ,
quotechar       = "
na_values       = -9999,NAN,NaN,nan,
encoding        = utf-8

[runtime]
use_numpy = auto
log_level = INFO

[site]
site_id            = FR-Gri
latitude           = 48.844243   # from the EddyPro site metadata shipped with the sample
measurement_height = 2.0         # instr_1_height in the same metadata (Gill HS-50)
canopy_height      = 0.15        # -> displacement = 0.10 m, i.e. z - d = 1.90 m
displacement_height =
north_offset       = 250.0       # instr_1_north_offset in the same metadata
pressure_pa        =             # p_air is a column below (PRESS_BOX, the LI-7200's own
                                 # near-ambient barometer). The sample carries no separate
                                 # ambient-pressure input, and miniflux invents none.

[period]
averaging_minutes     = 30
closed                = right    # each file holds (T-30min, T]; the file name is the period END
acquisition_frequency = 20.0
min_samples           = 0

[timestamp]
column = TIMESTAMP
format = numeric

[variables]
u      = U
v      = V
w      = W
ts     = T_SONIC
co2    = CO2_DRY                 # umol mol-1 of DRY air -- already conserved
h2o    = H2O_DRY                 # mmol mol-1 of DRY air -- ditto
ta     =                         # no ambient thermometer in the sample; Ta comes from Ts
p_air  = PRESS_BOX
t_cell =                         # not needed: nothing here is a cell density
p_cell =

[units]
ts     = K
ta     = K
p_air  = kPa
t_cell = degC
p_cell = kPa
co2    = umol/mol
h2o    = mmol/mol

[gases]
co2_measure_type = mixing_ratio
h2o_measure_type = mixing_ratio
analyser_path    = closed        # true of the instrument whichever column is read. It makes
                                 # the attenuation warning fire, which is the point: a dry
                                 # mixing ratio is exact in density terms and still low in
                                 # frequency response.

[despike]
enabled   = true
variables = u,v,w,ts,co2,h2o
q         = 7.0

[rotate]
method = double

[lag]
method  = covmax_default
scalars = co2,h2o
co2_nominal_s = 0.3              # ~0.3 s of tube on this short LI-7200 intake; it is the
co2_min_s     = -2.0             # fallback when the peak lands on a window edge
co2_max_s     = 2.0
h2o_nominal_s = 0.3
h2o_min_s     = -2.0
h2o_max_s     = 2.0

[detrend]
method    = block
variables = u,v,w,ts,co2,h2o

[wpl]
enabled = auto                   # -> does not run: both gases are dry mixing ratios, and a
                                 # closed-path gas is never owed an AMBIENT density correction
                                 # (ALGORITHMS 10.1)

[spectral]
enabled   = false                # see the header: FC, LE and E are attenuated while this is off
co2_tau_s =
h2o_tau_s =

[qc]
steady_state_pair = w,co2
itc               = true

[output]
na_value     = -9999
float_format = %.6g
